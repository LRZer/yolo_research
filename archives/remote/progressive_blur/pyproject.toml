[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-pgb-yolov8n"
version = "0.1.0"
description = "Object-protective distance-aware progressive background blur for YOLOv8n"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pgb*"]

