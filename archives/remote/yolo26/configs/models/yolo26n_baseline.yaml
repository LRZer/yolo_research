# YOLO26n 原版基线的“网络图纸”。它来自官方 yolo26.yaml，固定于：
# Git commit: 9d45ee4613e79d7bceef7a39e42c15c278b0d4e8
#
# 重要：此文件描述的是网络结构，不包含任何训练好的参数；权重保存在 .pt 文件中。
# 后续做改进时，请复制此文件为一个新名字再修改，永远保留本文件不动，作为公平对照。
#
# backbone/head 中每一行都遵循：[from, repeats, module, args]
#   from    ：输入来自哪一层；-1 表示紧挨着的上一层，[-1, 6] 表示同时取两层。
#   repeats ：该模块在“基础模型”中重复次数；会再乘以 scales 中的 depth 系数。
#   module  ：要实例化的 Python 模块名，例如 Conv、C3k2、C2PSA。
#   args    ：传给模块的额外参数；输入通道 c1 由程序自动推断，所以通常不写。
#
# YOLO26n 的 n 缩放规则：depth=0.50，width=0.25。
# 例如 Conv 的基础输出通道 64 会变为 16；基础 repeats=2 会变为实际 repeats=1。

# scale 明确锁定为 Nano（最小）版本；不允许因为文件名或默认值意外改成 s/m/l/x。
scale: n

# nc 是该官方结构的默认类别数（COCO 有 80 类）。训练 VOC 时，训练器会自动把 Detect
# 层改成 20 类；因此这里保持 80，不能手改成 20，否则“原版结构快照”就不再原样保留。
nc: 80

# 是否启用 YOLO26 的端到端检测方式；该值会传给 Detect 检测头。
end2end: True

# 边界框回归的 DFL（Distribution Focal Loss）分桶数量。1 表示不使用多分桶的 DFL 解码。
reg_max: 1

# 同一份基础结构可缩放为 n/s/m/l/x 五种大小。每一项是：
# [depth（深度系数）, width（宽度/通道系数）, max_channels（通道上限）]。
scales:
  n: [0.50, 0.25, 1024] # 当前使用：最小、最快；基础通道乘 0.25，基础重复数乘 0.50。
  s: [0.50, 0.50, 1024] # Small：比 n 更宽，参数量和计算量更大。
  m: [0.50, 1.00, 512]  # Medium：基础宽度，不用于本实验。
  l: [1.00, 1.00, 512]  # Large：更深，训练与推理更慢，不用于本实验。
  x: [1.00, 1.50, 512]  # Extra-large：最宽、最重，不用于本实验。

# Backbone（主干）：逐步下采样图片并提取越来越抽象的特征。
backbone:
  # 层 0：RGB 图片（3 通道）首次下采样。args=[基础输出通道64, 卷积核3, 步长2]；
  # YOLO26n 实际输出 16 通道，特征图大小从 640x640 变为 320x320，即 P1/2。
  - [-1, 1, Conv, [64, 3, 2]]

  # 层 1：再次下采样；基础 128 通道缩放为实际 32 通道，得到 P2/4（160x160）。
  - [-1, 1, Conv, [128, 3, 2]]

  # 层 2：C3k2 特征提取模块。args 中 256 是基础输出通道（n 实际为 64）；
  # False 表示内部不用 C3k 子块；0.25 是隐藏通道扩张比例 e。repeats=2 经 depth=0.5 后实际为 1。
  - [-1, 2, C3k2, [256, False, 0.25]]

  # 层 3：下采样到 P3/8（80x80），是后面检测小目标要用的一组特征；实际输出 64 通道。
  - [-1, 1, Conv, [256, 3, 2]]

  # 层 4：在 P3/8 尺度继续提取特征；基础 512 通道缩放为实际 128 通道，实际重复 1 次。
  - [-1, 2, C3k2, [512, False, 0.25]]

  # 层 5：下采样到 P4/16（40x40）；基础 512 通道缩放为实际 128 通道。
  - [-1, 1, Conv, [512, 3, 2]]

  # 层 6：P4/16 尺度的 C3k2。True 表示改用 C3k 内部子块；未写 e 时使用模块默认 e=0.5。
  # 基础 repeats=2 在 n 规模下仍会变成实际 1 次。
  - [-1, 2, C3k2, [512, True]]

  # 层 7：下采样到 P5/32（20x20）；基础 1024 通道缩放为实际 256 通道。
  - [-1, 1, Conv, [1024, 3, 2]]

  # 层 8：在最深的 P5/32 尺度提取高语义特征；True 仍表示内部使用 C3k 子块。
  - [-1, 2, C3k2, [1024, True]]

  # 层 9：SPPF 快速空间金字塔池化。args=[基础输出通道1024, 池化核5, 池化次数3, 残差连接True]；
  # 连续池化相当于融合 5/9/13 三种感受野，帮助模型“看得更广”；n 实际输出 256 通道。
  - [-1, 1, SPPF, [1024, 5, 3, True]]

  # 层 10：C2PSA 注意力模块。1024 是基础输出通道（n 实际 256）；repeats=2 经缩放后为 1 个 PSABlock。
  # C2PSA 用自注意力让不同空间位置互相参考，重点关注更有用的区域。
  - [-1, 2, C2PSA, [1024]]

# Head（检测头）：把深层语义与浅层细节融合，最后在 P3/P4/P5 三种尺度上检测。
head:
  # 层 11：把 P5/32 特征图上采样 2 倍到 P4/16；None 表示自动推断目标大小，nearest 是最近邻插值。
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  # 层 12：把层 11 的上采样特征与 backbone 层 6 的 P4 特征在通道维（1）拼接；
  # 实际通道数由 256 + 128 变为 384。Concat 自己不学习参数，只负责合并信息。
  - [[-1, 6], 1, Concat, [1]]

  # 层 13：融合后的 P4/16 特征；基础输出 512 缩放为实际 128 通道，True 表示使用 C3k 内部子块。
  - [-1, 2, C3k2, [512, True]]

  # 层 14：把融合后的 P4 特征再上采样 2 倍，回到 P3/8（80x80）。
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  # 层 15：拼接层 14（128 通道）与 backbone 层 4 的 P3 特征（128 通道），合计实际 256 通道。
  - [[-1, 4], 1, Concat, [1]]

  # 层 16：得到最终 P3/8 小目标特征；基础输出 256 缩放为实际 64 通道。
  - [-1, 2, C3k2, [256, True]]

  # 层 17：把 P3/8 特征下采样回 P4/16；基础输出 256 缩放为实际 64 通道。
  - [-1, 1, Conv, [256, 3, 2]]

  # 层 18：拼接层 17（64 通道）与层 13（128 通道）的 P4 特征，合计实际 192 通道。
  - [[-1, 13], 1, Concat, [1]]

  # 层 19：得到最终 P4/16 中目标特征；基础输出 512 缩放为实际 128 通道。
  - [-1, 2, C3k2, [512, True]]

  # 层 20：把 P4/16 特征下采样回 P5/32；基础输出 512 缩放为实际 128 通道。
  - [-1, 1, Conv, [512, 3, 2]]

  # 层 21：拼接层 20（128 通道）与层 10（256 通道）的最深特征，合计实际 384 通道。
  - [[-1, 10], 1, Concat, [1]]

  # 层 22：得到最终 P5/32 大目标特征。args=[基础输出1024, c3k=True, e=0.5, attn=True]；
  # 其中最后的 True 让 C3k2 内部使用注意力分支。n 实际输出 256 通道。
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  # 层 23：Detect 检测头同时接收层 16（P3/8，小目标）、19（P4/16，中目标）、22（P5/32，大目标）。
  # args 中 nc 是类别数变量；程序还会自动补入 reg_max、end2end 和三层输入通道 [64,128,256]。
  # 训练 VOC 时 nc 会由数据集自动覆盖为 20，输出每个目标的类别、位置和置信度。
  - [[16, 19, 22], 1, Detect, [nc]]
